# Sanitizer runs: ASan+UBSan over the CPU suite, and TSan over the concurrency-heavy subset.
# Too slow for every push (numbers in docs/development/ci.md), so they run nightly on main and on
# demand:   gh workflow run sanitizers.yml --ref <branch> -f sanitizer=asan
name: Sanitizers

on:
  schedule:
    - cron: "17 7 * * *"      # nightly, ASan/UBSan (and TSan on Sundays), against main
  workflow_dispatch:
    inputs:
      sanitizer:
        description: "Which sanitizer build to run"
        type: choice
        options: [asan, tsan, both]
        default: asan
      test_filter:
        description: "Override the Catch2 tag filter (empty = the documented default for that sanitizer)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}-${{ inputs.sanitizer || 'nightly' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODE_VERSION: "26.6"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CCACHE_DIR: /Users/runner/ccache    # outside the checkout: test_repo_hygiene walks the tree
  # No CCACHE_BASEDIR, deliberately. It makes ccache rewrite source paths to relative ones, so
  # __FILE__ becomes `../../tests/...`, and test_shader_format.cpp locates shaders/examples from
  # __FILE__: the case quietly turned into a SKIP (run 36069406479). The workspace path is the
  # same on every hosted run, so absolute paths cost no cache hits.
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 2G
  RESULTS: /Users/runner/ci-results   # absolute: upload-artifact rejects '..' in a path
  # The TSan subset: every tag whose cases start threads (census in docs/development/ci.md).
  # Tags only, OR-ed by the commas; the full suite does not fit a hosted job's 6 h under TSan.
  TSAN_SUBSET: "[jobs],[job],[motionthreads],[threading],[worldbuilder],[ring],[analysis],[motionlib],[ai],[transport]"

defaults:
  run:
    shell: bash

jobs:
  asan-build:
    name: ASan/UBSan build
    if: github.event_name == 'schedule' || inputs.sanitizer == 'asan' || inputs.sanitizer == 'both'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "::error title=Pinned Xcode missing::$DEVELOPER_DIR"; exit 1; }
          brew install ccache >/dev/null
          xcodebuild -version; clang --version | head -1
      - name: Restore dependency cache (CPM)
        id: cpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'cmake/patches/**') }}
      - name: Restore compiler cache (ccache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-asan-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-asan-
      - name: Configure and build (preset asan = Debug + ASan + UBSan)
        env:
          CPM_CACHE_STATE: ${{ steps.cpm.outputs.cache-hit == 'true' && 'hit' || 'miss (cold download)' }}
        run: tools/ci/build.sh asan "$RESULTS/build-asan"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-asan
          path: build/asan/tests/avgen_tests
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-logs-asan
          path: ${{ env.RESULTS }}/build-asan
          retention-days: 7

  asan-tests:
    # Debug -O0 + ASan is slow in a very uneven way: most cases take milliseconds, a few take hours,
    # and the worst cost is SHARED -- two films that a test file simulates once per process and
    # that random shards made every shard simulate again. So the partition is a plan,
    # tools/ci/sanitizer-plan.txt: named processes for the heavy and fixture-sharing cases, and rest
    # shards for everything else. Every case runs exactly once (`catch2_run.py plan-check`, run by
    # every push), except two the plan skips because no hosted job can finish them.
    # docs/development/ci.md, "The sanitizer partition", has the measurements. Expected per job:
    #   heavy-1   : the sequence film (one process, the floor), and two processes of long cases  ~4-5 h
    #   heavy-2   : the fade film, the director's own 30 s, two abduction scenarios            ~3.2-3.7 h
    #   heavy-3   : two abduction simulations, four half-hour cases, and rest shard 1 of 7      ~3.2-3.8 h
    #   rest-a/b  : rest shards 2-4 and 5-7 of 7 (every other default case, none over ~26 min)  ~2-2.5 h
    # Five jobs: one wave of the account's five macOS slots, not two.
    name: ASan/UBSan tests (${{ matrix.job }})
    needs: asan-build
    runs-on: macos-26
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          # `part`: whose named processes the job runs (none: ""). `shards` rest shards, global `first`
          # onwards of `total`, over the plan's rest filter. Three processes per job: the runner has 3 vCPUs.
          - { job: heavy-1, part: heavy-1, shards: 0, total: 0, first: 0 }
          - { job: heavy-2, part: heavy-2, shards: 0, total: 0, first: 0 }
          - { job: heavy-3, part: heavy-3, shards: 1, total: 7, first: 0 }
          - { job: rest-a,  part: "",      shards: 3, total: 7, first: 1 }
          - { job: rest-b,  part: "",      shards: 3, total: 7, first: 4 }
    env:
      # Gate: --gate sanitizer. Only a sanitizer report, a crash, a timeout or an unexercised case
      # fails this job. Assertion failures under Debug+ASan are listed, not gated: in run
      # 36087867052 they were all wall-clock ceilings ([performance]) and 10 s job waits that an
      # -O0 instrumented build cannot meet. Test correctness is gated by the Release CI run.
      # ASan halts on its first report (a fatal heap-buffer-overflow cannot be continued past even
      # with halt_on_error=0); the cases after it in that shard are reported as never run. UBSan
      # reports every distinct site and carries on; catch2_run.py fails the job on any
      # `runtime error:` line. detect_leaks: LeakSanitizer is unsupported by Apple clang on macOS.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=0:print_summary=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:report_error_type=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-asan
          path: build/asan/tests
      - name: Run avgen_tests under ASan/UBSan
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          SHARDS: ${{ matrix.shards }}
          SHARD_TOTAL: ${{ matrix.total }}
          SHARD_FIRST: ${{ matrix.first }}
          PART: ${{ matrix.part }}
          JOB: ${{ matrix.job }}
        run: |
          chmod +x build/asan/tests/avgen_tests
          # One seed for the whole matrix; a rest part's shards must partition the same order.
          seed=$(( GITHUB_RUN_ID % 2147483647 ))
          common=(--binary build/asan/tests/avgen_tests --name "asan-$JOB" --label "ASan/UBSan: $JOB"
                  --out "$RESULTS/asan-$JOB" --seed "$seed" --timeout-min 330
                  --exceptions tools/ci/hosted-runner-exceptions.txt --gate sanitizer)
          if [ -n "$TEST_FILTER" ]; then
            if [ "$JOB" != rest-a ]; then
              echo "A test_filter dispatch runs in the rest-a job only."; exit 0
            fi
            python3 tools/ci/catch2_run.py run "${common[@]}" --shards 3 --filter "$TEST_FILTER" \
                --expected-label "FILTERED $TEST_FILTER: not the full suite"
            exit $?
          fi
          label="tools/ci/sanitizer-plan.txt: ${PART:-no named processes}"
          if [ "$SHARDS" -gt 0 ]; then
            label="$label; rest shards $((SHARD_FIRST + 1))-$((SHARD_FIRST + SHARDS)) of $SHARD_TOTAL"
          fi
          python3 tools/ci/catch2_run.py run "${common[@]}" --plan tools/ci/sanitizer-plan.txt --part "$PART" \
              --shards "$SHARDS" --shard-total "$SHARD_TOTAL" --shard-first "$SHARD_FIRST" \
              --expected-label "$label"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sanitizer-logs-asan-${{ matrix.job }}
          path: |
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.json
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.md
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.xml
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.log
          retention-days: 14

  report:
    name: Report
    needs: [asan-build, asan-tests, tsan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sanitizer-logs-*
          path: results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-logs-*
          path: results
      - name: Write the run summary
        run: |
          cat > jobs.json <<EOF
          {"ASan/UBSan build": "${{ needs.asan-build.result }}",
           "ASan/UBSan tests (5 jobs, tools/ci/sanitizer-plan.txt)": "${{ needs.asan-tests.result }}",
           "TSan (concurrency subset)": "${{ needs.tsan.result }}"}
          EOF
          python3 tools/ci/catch2_run.py report --results-dir results --job-results jobs.json

  tsan:
    name: TSan (concurrency subset)
    if: (github.event_name == 'schedule' && github.event.schedule == '17 7 * * 0') || inputs.sanitizer == 'tsan' || inputs.sanitizer == 'both'
    runs-on: macos-26
    timeout-minutes: 350
    env:
      # TSan keeps going after a report and exits 66 at the end if it reported anything;
      # catch2_run.py also fails the job on any `WARNING: ThreadSanitizer` line.
      TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:history_size=4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          [ -d "$DEVELOPER_DIR" ] || { echo "::error title=Pinned Xcode missing::$DEVELOPER_DIR"; exit 1; }
          brew install ccache >/dev/null
          xcodebuild -version; clang --version | head -1
      - name: Restore dependency cache (CPM)
        id: cpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cpm
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'cmake/patches/**') }}
      - name: Restore compiler cache (ccache)
        id: ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-tsan-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-tsan-
      - name: Configure and build (preset tsan = Debug + TSan)
        env:
          CPM_CACHE_STATE: ${{ steps.cpm.outputs.cache-hit == 'true' && 'hit' || 'miss (cold download)' }}
        run: tools/ci/build.sh tsan "$RESULTS/build-tsan"
      - name: Run the TSan subset
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          filter="${TEST_FILTER:-$TSAN_SUBSET}"
          python3 tools/ci/catch2_run.py run --binary build/tsan/tests/avgen_tests --name tsan \
              --label "TSan subset" --out "$RESULTS/tsan" --shards 3 --timeout-min 300 \
              --exceptions tools/ci/hosted-runner-exceptions.txt --gate sanitizer \
              --filter "$filter" --expected-label "SUBSET $filter: not the full suite"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sanitizer-logs-tsan
          path: |
            ${{ env.RESULTS }}/tsan/*.json
            ${{ env.RESULTS }}/tsan/*.md
            ${{ env.RESULTS }}/tsan/*.xml
            ${{ env.RESULTS }}/tsan/*.log
            ${{ env.RESULTS }}/build-tsan
          retention-days: 14
