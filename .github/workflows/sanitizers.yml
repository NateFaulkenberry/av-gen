# Sanitizer runs over the CPU suite (avgen_tests), nightly on main and on demand:
#
#   asan-build ─▶ asan-tests (5 jobs, tools/ci/sanitizer-plan.txt)   ASan (+ UBSan's checks, recoverable)
#   ubsan      (build + whole default set, 3 shards)                   UBSan alone, fatal on the first report
#   tsan       (build + the concurrency set, 3 shards)                 TSan, every night
#   report     one summary with a row per sanitizer
#
#   gh workflow run sanitizers.yml --ref <branch> -f sanitizer=all     # all | asan | ubsan | tsan
#
# Each suite runs through tools/ci/run-suite.sh (e.g. `tools/ci/run-suite.sh ubsan --build`), so a
# developer can run exactly what a job ran. docs/development/ci.md, "Sanitizers", has the reasons for
# each exclusion, the timings and why UBSan has a job of its own.
name: Sanitizers

on:
  schedule:
    - cron: "17 7 * * *"      # nightly, against main
  workflow_dispatch:
    inputs:
      sanitizer:
        description: "Which sanitizer runs ('both' is the old name for all)"
        type: choice
        options: [all, asan, ubsan, tsan, both]
        default: all
      test_filter:
        description: "Override the Catch2 filter (empty = each sanitizer's documented default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}-${{ inputs.sanitizer || 'nightly' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODE_VERSION: "26.6"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CCACHE_DIR: /Users/runner/ccache    # outside the checkout: test_repo_hygiene walks the tree
  # No CCACHE_BASEDIR: see ci.yml (it turned a shader-format case into a quiet SKIP).
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 2G
  RESULTS: /Users/runner/ci-results   # absolute: upload-artifact rejects '..' in a path
  TEST_FILTER: ${{ inputs.test_filter }}

defaults:
  run:
    shell: bash

jobs:
  asan-build:
    name: ASan build
    if: github.event_name == 'schedule' || contains(fromJSON('["all","both","asan"]'), inputs.sanitizer)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cmake-preset
        with:
          preset: asan    # Debug + -fsanitize=address,undefined
          out: ${{ env.RESULTS }}/build-asan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-asan
          path: build/asan/tests/avgen_tests
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-logs-asan
          path: ${{ env.RESULTS }}/build-asan
          retention-days: 7

  asan-tests:
    # Debug -O0 + ASan is slow in a very uneven way, so the partition is a plan,
    # tools/ci/sanitizer-plan.txt: named processes for the heavy and fixture-sharing cases, and rest
    # shards for everything else. Every case runs exactly once (`catch2_run.py plan-check`, run by
    # every push). The jobs' shapes (which part, which rest shards) are in tools/ci/run-suite.sh.
    name: ASan tests (${{ matrix.job }})
    needs: asan-build
    runs-on: macos-26
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        job: [heavy-1, heavy-2, heavy-3, rest-a, rest-b]
    env:
      # Gate: --gate sanitizer. Only a sanitizer report, a crash, a timeout, an unexercised case or
      # an exit code the XML does not explain fails this job. Assertion failures under Debug+ASan are listed, not gated (wall-clock
      # ceilings an -O0 instrumented build cannot meet); the Release run gates correctness.
      # ASan halts on its first report; the cases after it in that process are reported as never
      # run. detect_stack_use_after_return: the class of bug ADR-941 fixed, which ASan missed with
      # it off. detect_leaks: LeakSanitizer is unsupported by Apple clang on macOS.
      # UBSan's checks are compiled in here too, recoverable: each report is printed, the process
      # carries on, and catch2_run.py fails the job on any `runtime error:` line. The ubsan job is
      # UBSan's own verdict.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=0:print_summary=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:report_error_type=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-asan
          path: build/asan/tests
      - name: Run avgen_tests under ASan
        env:
          JOB: ${{ matrix.job }}
        run: |
          chmod +x build/asan/tests/avgen_tests
          # One seed for the whole matrix ($GITHUB_RUN_ID): the rest shards must partition one order.
          tools/ci/run-suite.sh "asan:$JOB" --bin build/asan/tests --out "$RESULTS/asan-$JOB" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sanitizer-logs-asan-${{ matrix.job }}
          path: |
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.json
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.md
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.xml
            ${{ env.RESULTS }}/asan-${{ matrix.job }}/*.log
          retention-days: 14

  ubsan:
    name: UBSan (whole default set)
    # Its own build and job, not only the checks inside the ASan build: without ASan's shadow memory
    # a Debug build runs a few times slower than Release, not ~56x, so the WHOLE default set fits in
    # one job -- including the cases the ASan plan must skip -- and an ASan halt can no longer hide a
    # UBSan report behind it. halt_on_error=1 makes the first report kill its process: a non-zero
    # exit that catch2_run.py cannot misread, as well as the `runtime error:` line it also gates on.
    if: github.event_name == 'schedule' || contains(fromJSON('["all","both","ubsan"]'), inputs.sanitizer)
    runs-on: macos-26
    timeout-minutes: 355
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:report_error_type=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cmake-preset
        with:
          preset: ubsan   # Debug + -fsanitize=undefined
          out: ${{ env.RESULTS }}/build-ubsan
      - name: Run avgen_tests under UBSan
        run: |
          tools/ci/run-suite.sh ubsan --bin build/ubsan/tests --out "$RESULTS/ubsan" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sanitizer-logs-ubsan
          path: |
            ${{ env.RESULTS }}/ubsan/*.json
            ${{ env.RESULTS }}/ubsan/*.md
            ${{ env.RESULTS }}/ubsan/*.xml
            ${{ env.RESULTS }}/ubsan/*.log
            ${{ env.RESULTS }}/build-ubsan
          retention-days: 14

  tsan:
    name: TSan (concurrency set)
    # Every night. It was Sundays only while the ASan run took all five macOS slots for 4-5 h; the
    # set itself took 25 min to build and 27 min to run (docs/development/ci.md, "TSan").
    if: github.event_name == 'schedule' || contains(fromJSON('["all","both","tsan"]'), inputs.sanitizer)
    runs-on: macos-26
    timeout-minutes: 350
    env:
      # TSan keeps going after a report and exits 66 at the end if it reported anything;
      # catch2_run.py also fails the job on any `WARNING: ThreadSanitizer` line.
      TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1:history_size=4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cmake-preset
        with:
          preset: tsan    # Debug + -fsanitize=thread
          out: ${{ env.RESULTS }}/build-tsan
      - name: Run avgen_tests under TSan
        run: |
          tools/ci/run-suite.sh tsan --bin build/tsan/tests --out "$RESULTS/tsan" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sanitizer-logs-tsan
          path: |
            ${{ env.RESULTS }}/tsan/*.json
            ${{ env.RESULTS }}/tsan/*.md
            ${{ env.RESULTS }}/tsan/*.xml
            ${{ env.RESULTS }}/tsan/*.log
            ${{ env.RESULTS }}/build-tsan
          retention-days: 14

  report:
    name: Report
    needs: [asan-build, asan-tests, ubsan, tsan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # tools/ci/prune-caches.sh, on main only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sanitizer-logs-*
          path: results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-logs-*
          path: results
      - name: Write the run summary
        env:
          R_ASAN_BUILD: ${{ needs.asan-build.result }}
          R_ASAN: ${{ needs.asan-tests.result }}
          R_UBSAN: ${{ needs.ubsan.result }}
          R_TSAN: ${{ needs.tsan.result }}
        run: |
          python3 - > jobs.json <<'PY'
          import json, os
          print(json.dumps({
              "ASan build": os.environ["R_ASAN_BUILD"],
              "ASan tests (5 jobs, tools/ci/sanitizer-plan.txt)": os.environ["R_ASAN"],
              "UBSan (whole default set, fatal)": os.environ["R_UBSAN"],
              "TSan (concurrency set)": os.environ["R_TSAN"],
          }))
          PY
          python3 tools/ci/catch2_run.py report --results-dir results --job-results jobs.json
      - name: Prune superseded caches (main only)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/prune-caches.sh
