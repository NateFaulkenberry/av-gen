# AV Gen CI: the authoritative regression run. docs/development/ci.md explains every job.
#
#   push (any branch) ─▶ build (Release) ─┬─▶ cpu-tests   avgen_tests, full default set, 3 shards   GATES
#                                         ├─▶ gpu-hosted  avgen_render_tests + headless smoke        INFORMATIONAL,
#                                         │               main / nightly / dispatch: the hosted VM's paravirtual
#                                         │               Metal cannot compile the renderer's pipelines
#                                         ├─▶ cpu-assets  avgen_tests WITH the private test assets   GATES; nightly
#                                         │               and dispatch only, once the owner has enabled it
#                                         │               (vars.AVGEN_TEST_ASSETS == 'true')
#                                         └─▶ report      the "# AV Gen CI" run summary; prunes caches on main
#   gpu   self-hosted Apple GPU + private assets, builds for itself   GATES; main push, nightly and
#         dispatch, only once a runner is registered (vars.AVGEN_GPU_RUNNER == 'true')
#
# Every suite runs through tools/ci/run-suite.sh, which a developer runs locally with the same
# arguments. ASan, UBSan and TSan live in sanitizers.yml (nightly; too slow for every push).
#
# The purchased packs (assets/aliens, assets/farm) and the song are NEVER committed, cached or
# uploaded. The two asset jobs link them from a private repository (tools/fetch-test-assets.sh)
# into gitignored paths, upload text results only, and never run for pull_request events: a fork's
# code must never run with the asset secret or on the self-hosted runner.
# docs/development/gpu-ci-private-assets.md.
name: CI

on:
  push:
    # No path filter on purpose: docs/ is a test INPUT (test_repo_hygiene reads
    # docs/decisions/README.md and docs/dependencies.md, test_help reads docs/help, and
    # test_material_program parses docs/procedural-materials.md). Put [skip ci] in a commit message
    # to skip a run you know is pointless.
  pull_request:
  schedule:
    - cron: "43 6 * * *"   # nightly full run on main, including the GPU and asset jobs
  workflow_dispatch:
    inputs:
      gpu:
        description: "Also run the GPU jobs (hosted: informational; self-hosted: only if enabled)"
        type: boolean
        default: true
      assets:
        description: "Also run the CPU suite with the private test assets (only if enabled)"
        type: boolean
        default: true
      test_filter:
        description: "Catch2 tag filter for every suite, e.g. [ai] (empty = the full suite). Tags only: a name with a comma splits into two specs."
        required: false
        default: ""
      rng_seed:
        description: "Catch2 --rng-seed, to replay a run's order (empty = random; every run prints its seed)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # One live run per branch (or PR). A new push cancels the stale run, except on main, where every
  # commit's result is kept. A dispatched run is its own group: a targeted `test_filter` request
  # must not cancel the branch's full push run, nor be cancelled by the next push.
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned explicitly, not left to the image default, so a runner image update cannot silently
  # change the compiler. When the image drops this Xcode the build step says so; bump it here and
  # in sanitizers.yml together (the cache keys follow).
  XCODE_VERSION: "26.6"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  CCACHE_DIR: /Users/runner/ccache    # outside the checkout: test_repo_hygiene walks the tree
  # No CCACHE_BASEDIR, deliberately. It makes ccache rewrite source paths to relative ones, so
  # __FILE__ becomes `../../tests/...`, and test_shader_format.cpp locates shaders/examples from
  # __FILE__: the case quietly turned into a SKIP (run 36069406479). The workspace path is the
  # same on every hosted run, so absolute paths cost no cache hits.
  CCACHE_COMPRESS: "1"
  CCACHE_MAXSIZE: 2G
  RESULTS: /Users/runner/ci-results   # absolute: upload-artifact rejects '..' in a path
  # Dispatch inputs reach scripts through env only, never interpolated into a script.
  TEST_FILTER: ${{ inputs.test_filter }}
  RNG_SEED: ${{ inputs.rng_seed }}

defaults:
  run:
    # bash, not the default `sh -e`: GitHub then adds -o pipefail, so a piped command cannot hide a
    # failure (docs/testing.md entry 31).
    shell: bash

jobs:
  build:
    name: Build (Release)
    # Same-repository PRs already ran on their branch push; the PR shows those checks. Only a fork's
    # PR needs a pull_request run of its own. (Forks get read-only permissions and no secrets.)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cmake-preset
        with:
          preset: release
          out: ${{ env.RESULTS }}/build
      - name: Package test binaries
        run: |
          mkdir -p "$RESULTS/bin"
          cp build/release/tests/avgen_tests build/release/tests/avgen_render_tests build/release/src/avgen "$RESULTS/bin/"
          ls -la "$RESULTS/bin"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-release
          path: ${{ env.RESULTS }}/bin
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-logs
          path: ${{ env.RESULTS }}/build
          retention-days: 7

  cpu-tests:
    name: CPU tests (avgen_tests, full)
    needs: build
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-release
          path: build/release/bin
      - name: Run avgen_tests
        run: |
          chmod +x build/release/bin/*
          tools/ci/run-suite.sh cpu --bin build/release/bin --out "$RESULTS/cpu" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"} ${RNG_SEED:+--seed "$RNG_SEED"}
      - name: The sanitizer partition runs every case exactly once
        # tools/ci/sanitizer-plan.txt places the nightly ASan run's heavy cases by name. A rename would
        # quietly move a four-hour case into a rest shard and time the night out, so it fails here, in
        # the push that made it. Listing only, a few seconds (docs/development/ci.md, "The sanitizer partition").
        if: always()
        run: |
          python3 tools/ci/catch2_run.py plan-check --binary build/release/bin/avgen_tests \
              --plan tools/ci/sanitizer-plan.txt --exceptions tools/ci/hosted-runner-exceptions.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-cpu
          path: |
            ${{ env.RESULTS }}/cpu/*.json
            ${{ env.RESULTS }}/cpu/*.md
            ${{ env.RESULTS }}/cpu/*.xml
            ${{ env.RESULTS }}/cpu/*.log
          retention-days: 14

  gpu-hosted:
    name: GPU tests (hosted, informational)
    needs: build
    # Not on branch pushes: 363 of 443 cases fail on the hosted VM's GPU for reasons unrelated to
    # the change under test, so it would add ~15 minutes of wall time to every run for no verdict.
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.gpu)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-release
          path: build/release/bin
      - name: Run avgen_render_tests
        run: |
          chmod +x build/release/bin/*
          tools/ci/run-suite.sh gpu-hosted --bin build/release/bin --out "$RESULTS/gpu" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"} ${RNG_SEED:+--seed "$RNG_SEED"}
      - name: Headless binary smoke test
        if: always()
        # The same command tests/CMakeLists.txt registers as gpu.the-binary-renders-a-frame-headless.
        # Hyperspace is procedural (no gitignored asset), so its PNG is safe to upload.
        run: |
          set +e
          build/release/bin/avgen --headless --example Hyperspace --frames 1 --fps 30 --size 320x180 \
              --capture "$RESULTS/gpu/headless-smoke.png" > "$RESULTS/gpu/headless-smoke.log" 2>&1
          rc=$?
          tail -30 "$RESULTS/gpu/headless-smoke.log"
          if [ $rc -eq 0 ] && [ -s "$RESULTS/gpu/headless-smoke.png" ]; then
            echo "### Headless smoke (avgen --headless, 1 frame): PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Headless smoke (avgen --headless, 1 frame): FAIL (exit $rc), informational like the rest of this job" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Headless smoke failed (informational)::avgen --headless exited $rc; see headless-smoke.log in test-results-gpu"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-gpu
          path: |
            ${{ env.RESULTS }}/gpu/*.json
            ${{ env.RESULTS }}/gpu/*.md
            ${{ env.RESULTS }}/gpu/*.xml
            ${{ env.RESULTS }}/gpu/*.log
            ${{ env.RESULTS }}/gpu/headless-smoke.png
          retention-days: 14

  cpu-assets:
    name: CPU tests with private assets (Glowmere tier)
    needs: build
    # Trusted events only: never pull_request, so a fork's code never runs with the asset secret.
    # Off until the owner has published the asset repository and set the secret AND the variable
    # (docs/development/gpu-ci-private-assets.md); until then it is skipped, and the report says why.
    if: >-
      vars.AVGEN_TEST_ASSETS == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.assets))
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bin-release
          path: build/release/bin
      - name: Link the private test assets
        # Cloned into $RUNNER_TEMP, outside the checkout, then per-file symlinks into gitignored
        # assets/ paths. Not actions/cache, not an artifact: the VM is discarded after the job.
        env:
          AVGEN_TEST_ASSETS_TOKEN: ${{ secrets.AVGEN_TEST_ASSETS_TOKEN }}
          AVGEN_TEST_ASSETS_SSH_KEY: ${{ secrets.AVGEN_TEST_ASSETS_SSH_KEY }}
        run: tools/fetch-test-assets.sh
      - name: Run avgen_tests with the assets
        run: |
          chmod +x build/release/bin/*
          tools/ci/run-suite.sh cpu-assets --bin build/release/bin --out "$RESULTS/cpu-assets" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"} ${RNG_SEED:+--seed "$RNG_SEED"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # Text results only. Never an image, a mesh dump or anything under assets/.
          name: test-results-cpu-assets
          path: |
            ${{ env.RESULTS }}/cpu-assets/*.json
            ${{ env.RESULTS }}/cpu-assets/*.md
            ${{ env.RESULTS }}/cpu-assets/*.xml
            ${{ env.RESULTS }}/cpu-assets/*.log
          retention-days: 14

  gpu:
    name: GPU tests (self-hosted Apple GPU, authoritative)
    # Real Apple silicon with the private assets: the only GPU verdict that means anything.
    #   - vars.AVGEN_GPU_RUNNER is set to 'true' only once a runner with these labels is registered;
    #     without it a queued self-hosted job would wait a day for a machine that does not exist.
    #   - Trusted events only. This is a PUBLIC repository: a pull_request job on a self-hosted
    #     runner would run a stranger's code on the owner's machine. Pushes come from people with
    #     write access; schedule and dispatch run this repository's own code.
    # It builds for itself rather than using the hosted artifact: the binaries bake in their source
    # path (AVGEN_SOURCE_DIR), which differs on this machine.
    if: >-
      vars.AVGEN_GPU_RUNNER == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.gpu))
    runs-on: [self-hosted, macOS, ARM64, avgen-gpu]
    timeout-minutes: 180
    env:
      # Kept by the runner between jobs, beside (not inside) the workspace. Neither is an Actions
      # cache, and neither holds an asset.
      CCACHE_DIR: ${{ github.workspace }}/../avgen-ccache
      RESULTS: ${{ github.workspace }}/../avgen-ci-results
      AVGEN_TEST_ASSETS_DIR: ${{ github.workspace }}/../avgen-test-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Link the private test assets
        env:
          AVGEN_TEST_ASSETS_TOKEN: ${{ secrets.AVGEN_TEST_ASSETS_TOKEN }}
          AVGEN_TEST_ASSETS_SSH_KEY: ${{ secrets.AVGEN_TEST_ASSETS_SSH_KEY }}
        run: tools/fetch-test-assets.sh
      - name: Build (Release)
        run: |
          # Whatever Xcode this machine has selected (xcode-select), not the hosted image's pin.
          unset DEVELOPER_DIR
          rm -rf "$RESULTS" && mkdir -p "$RESULTS"
          tools/ci/build.sh release "$RESULTS/build" -DCPM_SOURCE_CACHE="$GITHUB_WORKSPACE/../avgen-cpm"
      - name: Run avgen_render_tests on the Apple GPU
        run: |
          tools/ci/run-suite.sh gpu --bin build/release/tests --out "$RESULTS/gpu-self" \
              ${TEST_FILTER:+--filter "$TEST_FILTER"} ${RNG_SEED:+--seed "$RNG_SEED"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # Text results only: this job renders the purchased models, so no PNG or EXR leaves it.
          name: test-results-gpu-self
          path: |
            ${{ env.RESULTS }}/gpu-self/*.json
            ${{ env.RESULTS }}/gpu-self/*.md
            ${{ env.RESULTS }}/gpu-self/*.xml
            ${{ env.RESULTS }}/gpu-self/*.log
          retention-days: 14
      - name: Remove the asset links from the workspace
        if: always()
        # The clone stays beside the workspace for the next run; the links inside it do not.
        run: git clean -fdxq assets/ || true

  report:
    name: Report
    needs: [build, cpu-tests, gpu-hosted, cpu-assets, gpu]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # tools/ci/prune-caches.sh, on main only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-*
          path: results
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-logs
          path: results
      - name: Write the run summary
        env:
          R_BUILD: ${{ needs.build.result }}
          R_CPU: ${{ needs.cpu-tests.result }}
          R_GPU_HOSTED: "${{ needs.gpu-hosted.result == 'skipped' && 'not run: branch push (runs on main, nightly and dispatch; hosted GPU is not authoritative)' || needs.gpu-hosted.result }}"
          R_ASSETS: "${{ needs.cpu-assets.result == 'skipped' && (vars.AVGEN_TEST_ASSETS == 'true' && 'not run: nightly and dispatch only' || 'not enabled: the private test assets are not set up (docs/development/gpu-ci-private-assets.md)') || needs.cpu-assets.result }}"
          R_GPU: "${{ needs.gpu.result == 'skipped' && (vars.AVGEN_GPU_RUNNER == 'true' && 'not run: main push, nightly and dispatch only' || 'not enabled: no self-hosted GPU runner registered (docs/development/gpu-ci-private-assets.md)') || needs.gpu.result }}"
        run: |
          python3 - > jobs.json <<'PY'
          import json, os
          print(json.dumps({
              "Build (Release)": os.environ["R_BUILD"],
              "CPU tests (avgen_tests, full)": os.environ["R_CPU"],
              "GPU tests (hosted, informational, not gating)": os.environ["R_GPU_HOSTED"],
              "CPU tests with private assets": os.environ["R_ASSETS"],
              "GPU tests (self-hosted Apple GPU)": os.environ["R_GPU"],
              "ASan / UBSan / TSan": "not in this workflow: the Sanitizers workflow (nightly on main, or gh workflow run sanitizers.yml)",
          }))
          PY
          python3 tools/ci/catch2_run.py report --results-dir results --job-results jobs.json
      - name: Prune superseded caches (main only)
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/prune-caches.sh
